name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Buat GitHub Release dari build ini?'
        type: boolean
        default: true
      release_tag:
        description: 'Tag rilis (contoh: v1.0.0). Kosongkan untuk otomatis (build-<run_number>).'
        type: string
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # ← WAJIB untuk membuat Release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Siapkan JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ── Perbaikan penting: matikan auto-accept lisensi yang interaktif ──
      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Terima lisensi Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Pastikan platform Android 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" > /dev/null
          sdkmanager "build-tools;36.0.0" > /dev/null || echo "build-tools 36.0.0 tidak tersedia, AGP memakai versi bawaannya."

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sinkronkan Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VEMOTION_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VEMOTION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VEMOTION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VEMOTION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VEMOTION_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
          VEMOTION_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          export VEMOTION_VERSION_NAME="${VEMOTION_VERSION_NAME#v}"
          ./gradlew assembleDebug --no-daemon
          if [ -n "${VEMOTION_KEYSTORE_B64:-}" ]; then
            echo "$VEMOTION_KEYSTORE_B64" | base64 -d > release.keystore
            export VEMOTION_KEYSTORE_PATH="$PWD/release.keystore"
            ./gradlew assembleRelease bundleRelease --no-daemon
            echo "RILIS_DIBUAT=1" >> "$GITHUB_ENV"
          else
            echo "Secret ANDROID_KEYSTORE_BASE64 kosong: hanya APK debug yang dibuat."
          fi

      # ── Tentukan nama tag rilis (dipakai step Release di bawah) ──
      - name: Tentukan nama tag rilis
        id: reltag
        if: |
          github.ref_type == 'tag' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="build-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag rilis: $TAG"

      - name: Bersihkan keystore
        if: always()
        run: rm -f android/release.keystore

      - name: Unggah APK debug (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vemotion-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Unggah APK dan AAB rilis (artifact)
        if: env.RILIS_DIBUAT == '1'
        uses: actions/upload-artifact@v4
        with:
          name: vemotion-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # ── Buat GitHub Release + lampirkan file build ──
      - name: Buat GitHub Release
        if: steps.reltag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: ${{ steps.reltag.outputs.tag }}
          generate_release_notes: true
          # Tandai pre-release jika hanya APK debug (tanpa keystore)
          prerelease: ${{ env.RILIS_DIBUAT != '1' }}
          fail_on_unmatched_files: false
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk

      - name: Ringkasan
        run: |
          {
            echo "### 📦 Hasil build"
            echo ""
            ls -lh android/app/build/outputs/apk/debug/*.apk 2>&1 || true
            if [ "${RILIS_DIBUAT:-0}" = "1" ]; then
              ls -lh android/app/build/outputs/apk/release/*.apk 2>&1 || true
              ls -lh android/app/build/outputs/bundle/release/*.aab 2>&1 || true
            fi
            if [ -n "${{ steps.reltag.outputs.tag }}" ]; then
              echo ""
              echo "### 🚀 Rilis dibuat"
              echo "Tag: [\`${{ steps.reltag.outputs.tag }}\`](https://github.com/${{ github.repository }}/releases/tag/${{ steps.reltag.outputs.tag }})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
