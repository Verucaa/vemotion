name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pastikan platform Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" >/dev/null
          sdkmanager "build-tools;36.0.0" >/dev/null || echo "build-tools 36.0.0 tidak tersedia, AGP memakai versi bawaannya."

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sinkronkan Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VEMOTION_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VEMOTION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VEMOTION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VEMOTION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VEMOTION_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
          VEMOTION_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          export VEMOTION_VERSION_NAME="${VEMOTION_VERSION_NAME#v}"
          ./gradlew assembleDebug --no-daemon
          if [ -n "${VEMOTION_KEYSTORE_B64:-}" ]; then
            echo "$VEMOTION_KEYSTORE_B64" | base64 -d > release.keystore
            export VEMOTION_KEYSTORE_PATH="$PWD/release.keystore"
            ./gradlew assembleRelease bundleRelease --no-daemon
            echo "RILIS_DIBUAT=1" >> "$GITHUB_ENV"
          else
            echo "Secret ANDROID_KEYSTORE_BASE64 kosong: hanya APK debug yang dibuat."
          fi

      - name: Bersihkan keystore
        if: always()
        working-directory: android
        run: rm -f release.keystore

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: vemotion-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Unggah APK dan AAB rilis
        if: env.RILIS_DIBUAT == '1'
        uses: actions/upload-artifact@v4
        with:
          name: vemotion-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Ringkasan
        run: |
          echo "### Hasil build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh android/app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"
          if [ "${RILIS_DIBUAT:-0}" = "1" ]; then
            ls -lh android/app/build/outputs/apk/release/*.apk android/app/build/outputs/bundle/release/*.aab >> "$GITHUB_STEP_SUMMARY"
          fi
